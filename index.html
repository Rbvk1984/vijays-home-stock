<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Our Home Stock</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A2E">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  html{ color-scheme: light only; }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #E4E9D9 !important; --surface: #FFFFFF !important; --text: #23291F !important;
      --text-soft: #5B6459 !important; --border: #DDE2D2 !important;
    }
  }
  html, body{ background-color:#EEF0E4 !important; }
  :root{
    --bg: #E4E9D9;
    --surface: #FFFFFF;
    --nav: #1F3A2E;
    --nav-light: #2E5241;
    --accent: #D9A441;
    --accent-dark: #B4831A;
    --alert: #C1502E;
    --alert-bg: #F7E2D8;
    --ok: #4F7A5B;
    --ok-bg: #E1EBE2;
    --mid: #C98A2E;
    --mid-bg: #F7EBD6;
    --text: #23291F;
    --text-soft: #5B6459;
    --border: #DDE2D2;
    --radius-card: 14px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif; -webkit-tap-highlight-color:transparent;
    min-height:100vh; padding-bottom:76px;
  }
  h1,h2,h3, .brand, .nav-label{ font-family:'Fredoka',sans-serif; }

  /* ---------- Desktop width cap: keep the app phone-sized on large screens ---------- */
  @media (min-width: 560px){
    #app{ max-width:480px; margin:0 auto; box-shadow:0 0 40px rgba(0,0,0,0.08); min-height:100vh; }
    .bottom-nav{ max-width:480px; left:50%; transform:translateX(-50%); }
    #pin-screen .pin-card{ box-shadow:0 20px 60px rgba(0,0,0,0.35); }
  }

  /* ---------- Verse strip ---------- */
  .verse-strip{
    text-align:center; padding:10px 24px; font-size:0.8rem; font-weight:700; font-style:italic;
    color:var(--accent-dark); background:linear-gradient(135deg, #F7EBD6, #EEF0E4);
    line-height:1.4; border-bottom:1px solid var(--border);
    animation:verse-glow 3s ease-in-out infinite; transition:opacity 0.5s ease;
  }
  @keyframes verse-glow{
    0%, 100% { box-shadow: inset 0 0 0 rgba(217,164,65,0); }
    50% { box-shadow: inset 0 0 24px rgba(217,164,65,0.35); }
  }
  .verse-strip.fading{ opacity:0; }

  @keyframes pulse-glow{
    0%, 100% { box-shadow: 0 0 0 rgba(193,80,46,0); }
    50% { box-shadow: 0 0 10px rgba(193,80,46,0.6); }
  }
  .status-pill.low, .stat-chip.low{
    animation: pulse-glow 1.8s ease-in-out infinite;
  }
  @keyframes pulse-text{
    0%, 100% { opacity:1; }
    50% { opacity:0.55; }
  }
  .attention-group-label.low{
    animation: pulse-text 1.8s ease-in-out infinite;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    background:linear-gradient(135deg, var(--nav-light) 0%, var(--nav) 70%);
    color:#fff; padding:18px 20px 16px;
    display:flex; align-items:center; justify-content:space-between;
    border-radius:0 0 20px 20px; box-shadow:0 6px 20px rgba(31,58,46,0.25);
  }
  .brand{ font-size:1.35rem; font-weight:600; display:flex; align-items:center; gap:8px; }
  .brand-photo{
    width:32px; height:32px; border-radius:50%; background:var(--accent);
    background-image:url('family.jpg'); background-size:cover; background-position:center;
    border:2px solid rgba(255,255,255,0.5); flex-shrink:0;
  }
  .whoami{ display:flex; align-items:center; gap:10px; font-size:0.85rem; color:#DCE6DD; }
  .whoami button{
    background:var(--nav-light); border:none; color:#fff; padding:6px 12px;
    border-radius:var(--radius-pill); font-size:0.8rem; cursor:pointer;
  }

  /* ---------- PIN screen ---------- */
  #pin-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px;
    background:
      linear-gradient(rgba(31,58,46,0.78), rgba(31,58,46,0.88)),
      url('family.jpg') center/cover no-repeat,
      radial-gradient(circle at 30% 20%, var(--nav-light), var(--nav) 70%);
  }
  .pin-card{
    background:var(--surface); border-radius:22px; padding:20px 28px 32px; width:100%; max-width:340px;
    box-shadow:0 20px 40px rgba(0,0,0,0.25); text-align:center;
  }
  .pin-photo{
    width:calc(100% + 56px); margin:-20px -28px 16px; aspect-ratio:16/9;
    background-color:var(--bg); background-image:url('family.jpg'); background-size:cover;
    background-position:center; border-radius:22px 22px 0 0;
  }
  .pin-card h1{ margin:0 0 4px; font-size:1.5rem; color:var(--nav); }
  .pin-card p{ margin:0 0 20px; color:var(--text-soft); font-size:0.9rem; }
  #who-select{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px;
  }
  .who-chip{
    padding:8px 16px; border-radius:var(--radius-pill); border:2px solid var(--border);
    background:#fff; cursor:pointer; font-weight:600; font-size:0.9rem; color:var(--text-soft);
  }
  .who-chip.active{ border-color:var(--accent); background:var(--accent); color:#fff; }
  #pin-dots{ display:flex; gap:12px; justify-content:center; margin:14px 0 20px; }
  .pin-dot{ width:14px; height:14px; border-radius:50%; border:2px solid var(--border); }
  .pin-dot.filled{ background:var(--nav); border-color:var(--nav); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .key{
    padding:16px 0; border-radius:14px; border:none; background:var(--bg);
    font-size:1.2rem; font-weight:600; cursor:pointer; color:var(--text);
  }
  .key:active{ background:var(--border); }
  .key.wide{ font-size:0.9rem; color:var(--text-soft); }
  #pin-error{ color:var(--alert); font-size:0.85rem; height:18px; margin-top:8px; }

  /* ---------- Search bar ---------- */
  .search-bar{ padding:10px 16px 0; }
  .search-bar input{
    width:100%; padding:11px 16px; border-radius:var(--radius-pill); border:1.5px solid var(--border);
    font-size:16px; font-family:inherit; background:var(--surface); color:var(--text);
  }
  .search-bar input:focus{ outline:none; border-color:var(--accent); }

  /* ---------- Dashboard summary strip ---------- */
  .dashboard-strip{
    display:flex; gap:8px; padding:16px 16px 4px; overflow-x:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, black 92%, transparent 100%);
    mask-image:linear-gradient(to right, black 92%, transparent 100%);
  }
  .dashboard-strip::-webkit-scrollbar{ display:none; }
  .stat-chip{
    flex:1; min-width:82px; border-radius:14px; padding:10px 8px; text-align:center;
    display:flex; flex-direction:column; gap:2px; color:#fff;
  }
  .stat-chip .stat-num{ font-family:'Fredoka',sans-serif; font-size:1.3rem; font-weight:700; }
  .stat-chip .stat-label{ font-size:0.68rem; opacity:0.95; line-height:1.15; }
  .stat-chip.ok{ background:linear-gradient(135deg, var(--ok), #3c6249); }
  .stat-chip.mid{ background:linear-gradient(135deg, var(--mid), #9a6b1e); }
  .stat-chip.low{ background:linear-gradient(135deg, var(--alert), #9c3d22); }
  .stat-chip.cart{ background:linear-gradient(135deg, var(--nav-light), var(--nav)); }
  .stat-chip{ cursor:pointer; transition:transform 0.12s; }
  .stat-chip:active{ transform:scale(0.96); }
  .stat-chip.chip-active{ box-shadow:0 0 0 3px rgba(255,255,255,0.7) inset, 0 3px 10px rgba(0,0,0,0.2); }

  /* ---------- Needs Your Attention ---------- */
  .attention-section{ padding:14px 16px 4px; }
  .attention-title{
    font-family:'Fredoka',sans-serif; font-size:0.95rem; font-weight:600; color:var(--nav);
    margin-bottom:10px; display:flex; align-items:center; gap:6px;
  }
  .attention-group{ margin-bottom:12px; }
  .attention-group-label{
    font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    margin-bottom:6px; padding-left:2px;
  }
  .attention-group-label.low{ color:var(--alert); }
  .attention-group-label.mid{ color:var(--mid); }
  .attention-row{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:10px 14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; cursor:pointer;
  }
  .attention-row .emoji{ font-size:1.4rem; flex-shrink:0; }
  .attention-row .info{ flex:1; min-width:0; }
  .attention-row .info .name{
    font-weight:600; font-size:0.9rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .attention-row .info .meta{
    font-size:0.7rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .attention-empty{
    text-align:center; color:var(--ok); background:var(--ok-bg); border-radius:12px;
    padding:16px; font-size:0.85rem; font-weight:600;
  }

  /* ---------- Updated-by line on cards ---------- */
  .updated-by{ font-size:0.68rem; color:var(--text-soft); margin-top:-2px; }

  /* ---------- Category chips ---------- */
  .chip-row{
    display:flex; gap:8px; overflow-x:auto; padding:16px 16px 4px; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, black 92%, transparent 100%);
    mask-image:linear-gradient(to right, black 92%, transparent 100%);
  }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:8px 14px; border-radius:var(--radius-pill); background:var(--surface);
    border:1px solid var(--border); font-size:0.85rem; font-weight:600; color:var(--text-soft);
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:linear-gradient(135deg, var(--nav-light), var(--nav)); color:#fff; border-color:var(--nav); }

  /* ---------- Item grid ---------- */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px 16px 24px; }
  .card{
    background:var(--surface); border-radius:var(--radius-card); padding:14px;
    border:1px solid var(--border); border-left:4px solid var(--border);
    display:flex; flex-direction:column; gap:8px; min-height:230px;
    position:relative; box-shadow:0 3px 10px rgba(35,41,31,0.06);
  }
  .card.status-low{ border-left-color:var(--alert); }
  .card.status-mid{ border-left-color:var(--mid); }
  .card.status-ok{ border-left-color:var(--ok); }
  .card .emoji-photo{
    width:100%; aspect-ratio:1.6; border-radius:10px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:2.5rem;
    overflow:hidden;
  }
  .emoji-photo.status-low{ background:linear-gradient(160deg, var(--alert-bg), #fff); }
  .emoji-photo.status-mid{ background:linear-gradient(160deg, var(--mid-bg), #fff); }
  .emoji-photo.status-ok{ background:linear-gradient(160deg, var(--ok-bg), #fff); }
  .card .emoji-photo img{ width:100%; height:100%; object-fit:cover; }
  .card .item-name{
    font-weight:700; font-size:0.98rem; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-category{
    font-size:0.72rem; color:var(--text-soft); margin-top:-4px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .status-pill{
    align-self:flex-start; font-size:0.72rem; font-weight:700; padding:3px 9px;
    border-radius:var(--radius-pill);
  }
  .status-pill.low{ background:var(--alert-bg); color:var(--alert); }
  .status-pill.mid{ background:var(--mid-bg); color:var(--mid); }
  .status-pill.ok{ background:var(--ok-bg); color:var(--ok); }

  .level-control{ display:flex; gap:6px; }
  .level-btn{
    flex:1; padding:9px 0; border-radius:9px; border:1.5px solid var(--border); background:#fff;
    font-size:0.75rem; font-weight:700; cursor:pointer; color:var(--text-soft);
  }
  .level-btn.selected.low{ background:var(--alert); border-color:var(--alert); color:#fff; }
  .level-btn.selected.medium{ background:var(--mid); border-color:var(--mid); color:#fff; }
  .level-btn.selected.high{ background:var(--ok); border-color:var(--ok); color:#fff; }

  .numeric-control{ display:flex; align-items:center; justify-content:space-between; }
  .numeric-control .qty{ font-weight:700; font-size:1rem; }
  .numeric-control button{
    width:32px; height:32px; border-radius:50%; border:none; background:var(--bg);
    font-size:1.1rem; font-weight:700; cursor:pointer; color:var(--nav);
  }
  .delete-x{
    position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:50%;
    background:var(--bg); border:none; color:var(--text-soft); font-size:0.85rem; cursor:pointer;
    display:none; align-items:center; justify-content:center;
  }
  .admin-mode .delete-x{ display:flex; }

  /* ---------- Shopping list ---------- */
  .shop-list{ padding:16px 16px 88px; display:flex; flex-direction:column; gap:10px; }
  .shop-row{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:12px;
  }
  .shop-row .emoji{ font-size:1.6rem; flex-shrink:0; }
  .shop-row .info{ flex:1; min-width:0; }
  .shop-row .info .name{
    font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .shop-row .info .cat{
    font-size:0.75rem; color:var(--text-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .shop-row .status-pill{ flex-shrink:0; }
  .shop-row .mark-bought-btn{ flex-shrink:0; }
  .shop-group{ margin-bottom:6px; }
  /* ---------- Recently Updated feed ---------- */
  .recent-activity-section{ padding:4px 16px 88px; }
  .recent-activity-title{
    font-family:'Fredoka',sans-serif; font-size:0.9rem; font-weight:600; color:var(--nav);
    margin:10px 0 8px; display:flex; align-items:center; gap:6px;
  }
  .activity-row{
    display:flex; align-items:center; gap:8px; padding:7px 0; font-size:0.78rem; color:var(--text-soft);
    border-bottom:1px solid var(--border);
  }
  .activity-row:last-child{ border-bottom:none; }
  .activity-row .emoji{ font-size:1rem; }
  .activity-row b{ color:var(--text); }
  .activity-row .time{ margin-left:auto; font-size:0.7rem; white-space:nowrap; }

  /* ---------- Favorite star toggle ---------- */
  .fav-star{
    position:absolute; top:6px; left:6px; width:30px; height:30px; border-radius:50%;
    background:rgba(255,255,255,0.85); border:none; color:var(--border); font-size:0.95rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fav-star.active{ color:var(--accent); }

  .mark-bought-btn{
    background:var(--ok); color:#fff; border:none; padding:7px 12px; border-radius:var(--radius-pill);
    font-size:0.72rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .empty-state{ text-align:center; color:var(--text-soft); padding:40px 20px; font-size:0.9rem; }
  .empty-state .big{ font-size:2rem; display:block; margin-bottom:8px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface);
    border-top:1px solid var(--border); display:flex; padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    gap:6px; z-index:20;
  }
  .nav-item{
    flex:1; text-align:center; padding:8px 0; border-radius:12px; cursor:pointer;
    color:var(--text-soft); font-size:0.72rem; font-weight:600;
  }
  .nav-item .icon{ font-size:1.25rem; display:block; }
  .nav-item.active{ color:var(--nav); background:var(--bg); }

  /* ---------- Add item modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none;
    align-items:flex-end; z-index:30;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background:var(--surface); width:100%; border-radius:20px 20px 0 0; padding:22px 20px 28px;
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{ margin:0 0 14px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:0.8rem; font-weight:600; color:var(--text-soft); margin-bottom:5px; }
  .field input, .field select{
    width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border);
    font-size:16px; font-family:inherit; background:#fff;
  }
  .field .row2{ display:flex; gap:10px; }
  .field .row2 > *{ flex:1; }
  .modal .actions{ display:flex; gap:10px; margin-top:6px; }
  .btn{
    flex:1; padding:12px 0; border-radius:12px; border:none; font-weight:700; cursor:pointer; font-size:0.95rem;
  }
  .btn.primary{ background:var(--nav); color:#fff; }
  .btn.ghost{ background:var(--bg); color:var(--text-soft); }
  .fab{
    position:fixed; right:18px; bottom:88px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:1.5rem; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    cursor:pointer; z-index:15; display:none;
  }
  .admin-mode .fab{ display:block; }

  #config-warning{
    background:var(--alert-bg); color:var(--alert); font-size:0.8rem; padding:10px 16px;
    text-align:center; display:none;
  }
</style>
</head>
<body>

<div id="config-warning">⚠️ Supabase not configured yet — edit the CONFIG section in index.html</div>

<!-- ===================== PIN SCREEN ===================== -->
<div id="pin-screen">
  <div class="pin-card">
    <div class="pin-photo"></div>
    <h1>🏠 Our Home Stock</h1>
    <p>Pick your name and enter your PIN</p>
    <div id="who-select"></div>
    <div id="pin-dots"></div>
    <div class="keypad" id="keypad"></div>
    <div id="pin-error"></div>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<div id="app" style="display:none;">
  <div class="verse-strip" id="verse-strip"></div>
  <div class="topbar">
    <div class="brand"><span class="brand-photo"></span>🏠 Our Home Stock</div>
    <div class="whoami">
      <span id="current-user-label"></span>
      <button onclick="logout()">Switch</button>
    </div>
  </div>

  <!-- HOME TAB -->
  <div id="tab-home">
    <div class="dashboard-strip" id="dashboard-strip"></div>
    <div class="chip-row" id="category-chips"></div>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="🔍 Search groceries" oninput="onSearchInput()">
    </div>
    <div class="attention-section" id="attention-section"></div>
    <div class="grid" id="item-grid"></div>
    <div class="recent-activity-section" id="recent-activity-section"></div>
  </div>

  <!-- SHOPPING LIST TAB -->
  <div id="tab-shop" style="display:none;">
    <div class="shop-list" id="shop-list"></div>
  </div>

  <button class="fab" onclick="openAddModal()">+</button>

  <div class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <span class="icon">🏠</span>Home
    </div>
    <div class="nav-item" id="nav-shop" onclick="switchTab('shop')">
      <span class="icon">🛒</span>Shopping List
    </div>
  </div>
</div>

<!-- ===================== ADD / EDIT ITEM MODAL ===================== -->
<div class="modal-backdrop" id="add-modal-backdrop" onclick="if(event.target===this) closeAddModal()">
  <div class="modal">
    <h3 id="modal-title">Add an item</h3>
    <div class="field">
      <label>Name</label>
      <input type="text" id="new-name" placeholder="e.g. Tomato">
    </div>
    <div class="field row2">
      <div>
        <label>Emoji</label>
        <input type="text" id="new-emoji" placeholder="🍅" maxlength="4">
      </div>
      <div>
        <label>Category</label>
        <select id="new-category"></select>
      </div>
    </div>
    <div class="field">
      <label>Track by</label>
      <select id="new-type" onchange="toggleNewTypeFields()">
        <option value="level">Low / Medium / High</option>
        <option value="numeric">Amount (kg, litres, pcs...)</option>
      </select>
    </div>
    <div class="field row2" id="new-numeric-fields" style="display:none;">
      <div>
        <label>Unit</label>
        <select id="new-unit">
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="litre">litre</option>
          <option value="ml">ml</option>
          <option value="pcs">pcs</option>
          <option value="pack">pack</option>
          <option value="bottle">bottle</option>
        </select>
      </div>
      <div>
        <label>Low-stock threshold</label>
        <input type="number" id="new-threshold" placeholder="0.5">
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeAddModal()">Cancel</button>
      <button class="btn primary" id="modal-submit-btn" onclick="submitNewItem()">Add item</button>
    </div>
    <button class="btn ghost" id="modal-delete-btn" style="display:none; width:100%; margin-top:10px; color:var(--alert);" onclick="deleteFromModal()">Remove this item</button>
  </div>
</div>

<!-- ===================== MARK AS BOUGHT MODAL ===================== -->
<div class="modal-backdrop" id="buy-modal-backdrop" onclick="if(event.target===this) closeBuyModal()">
  <div class="modal">
    <h3>Mark as bought</h3>
    <p id="buy-modal-item-name" style="margin:-6px 0 14px; color:var(--text-soft); font-size:0.9rem;"></p>
    <div class="field">
      <label>How much did you buy?</label>
      <div style="display:flex; gap:10px; align-items:center;">
        <div style="flex:1;"><input type="number" id="buy-quantity" step="0.1" placeholder="e.g. 2"></div>
        <span id="buy-unit-label" style="font-weight:700; color:var(--text-soft); white-space:nowrap;"></span>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeBuyModal()">Cancel</button>
      <button class="btn primary" onclick="confirmBuy()">Add to stock</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIG — paste your own Supabase project details here
   (Project Settings → API in your Supabase dashboard)
   ===================================================================== */
const SUPABASE_URL = "https://prypoybnyfypzfjwsbai.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_lEYb7WZZ0RrixNMahPxqyw_MTaCPLZB";

/* Optional: Telegram notifications. Leave blank to skip for now. */
const TELEGRAM_BOT_TOKEN = "";
const TELEGRAM_CHAT_ID = "";

/* ===================================================================== */

let supabaseClient;
if (SUPABASE_URL.startsWith("http")) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  document.getElementById('config-warning').style.display = 'block';
}

let familyMembers = [];
let categories = [];
let items = [];
let selectedMember = null;
let enteredPin = "";
let currentUser = null; // { id, name, role }
let activeCategory = "all";
let searchQuery = "";
let statusFilter = null; // 'ok' | 'mid' | 'low' | null
let currentTab = "home";

/* ---------------- PIN SCREEN ---------------- */

async function initPinScreen(){
  if (!supabaseClient) return;
  const { data, error } = await supabaseClient.from('family_members').select('id,name,role').order('created_at');
  if (error) { console.error(error); return; }
  familyMembers = data;
  const who = document.getElementById('who-select');
  who.innerHTML = '';
  familyMembers.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'who-chip';
    chip.textContent = m.name;
    chip.onclick = () => selectMember(m, chip);
    who.appendChild(chip);
  });
  if (familyMembers.length) selectMember(familyMembers[0], who.children[0]);

  const keypad = document.getElementById('keypad');
  keypad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key' + (k === '⌫' ? ' wide' : '');
    btn.textContent = k;
    if (k === '') { btn.style.visibility = 'hidden'; }
    else if (k === '⌫') { btn.onclick = () => backspacePin(); }
    else { btn.onclick = () => pressPin(k); }
    keypad.appendChild(btn);
  });
  renderPinDots();
}

function selectMember(m, chipEl){
  selectedMember = m;
  document.querySelectorAll('.who-chip').forEach(c => c.classList.remove('active'));
  chipEl.classList.add('active');
  enteredPin = '';
  renderPinDots();
  document.getElementById('pin-error').textContent = '';
}

function renderPinDots(){
  const wrap = document.getElementById('pin-dots');
  wrap.innerHTML = '';
  for (let i=0;i<4;i++){
    const d = document.createElement('div');
    d.className = 'pin-dot' + (i < enteredPin.length ? ' filled' : '');
    wrap.appendChild(d);
  }
}

function pressPin(digit){
  if (enteredPin.length >= 4) return;
  enteredPin += digit;
  renderPinDots();
  if (enteredPin.length === 4) checkPin();
}

function backspacePin(){
  enteredPin = enteredPin.slice(0, -1);
  renderPinDots();
  document.getElementById('pin-error').textContent = '';
}

async function checkPin(){
  if (!selectedMember) return;
  const { data, error } = await supabaseClient.rpc('verify_pin', {
    p_name: selectedMember.name, p_pin: enteredPin
  });
  const match = data && data.length ? data[0] : null;
  if (match && !error){
    currentUser = { id: match.id, name: match.name, role: match.role };
    document.getElementById('pin-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('current-user-label').textContent = `👋 ${currentUser.name}`;
    document.body.classList.toggle('admin-mode', currentUser.role === 'admin');
    loadAppData();
  } else {
    document.getElementById('pin-error').textContent = 'Wrong PIN, try again';
    enteredPin = '';
    setTimeout(renderPinDots, 200);
  }
}

function logout(){
  currentUser = null;
  enteredPin = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pin-screen').style.display = 'flex';
  renderPinDots();
}

/* ---------------- MAIN APP DATA ---------------- */

async function loadAppData(){
  const { data: cats } = await supabaseClient.from('categories').select('*').order('sort_order');
  categories = cats || [];
  await refreshItems();
  renderCategoryChips();
  subscribeRealtime();
  populateNewItemCategorySelect();
  renderRecentActivity();
}

async function refreshItems(){
  const { data } = await supabaseClient.from('items').select('*').order('name');
  items = data || [];
  renderGrid();
  renderShopList();
  renderDashboard();
  renderAttentionList();
}

/* ---------------- DASHBOARD SUMMARY STRIP ---------------- */

function renderDashboard(){
  const wrap = document.getElementById('dashboard-strip');
  const okCount = items.filter(i => statusFor(i).cls === 'ok').length;
  const midCount = items.filter(i => statusFor(i).cls === 'mid').length;
  const lowCount = items.filter(i => statusFor(i).cls === 'low').length;
  const cartCount = midCount + lowCount;
  const activeCls = (cls) => statusFilter === cls ? ' chip-active' : '';

  wrap.innerHTML = `
    <div class="stat-chip ok${activeCls('ok')}" onclick="setStatusFilter('ok')"><div class="stat-num">${okCount}</div><div class="stat-label">🟢 Well stocked</div></div>
    <div class="stat-chip mid${activeCls('mid')}" onclick="setStatusFilter('mid')"><div class="stat-num">${midCount}</div><div class="stat-label">🟠 Running low</div></div>
    <div class="stat-chip low${activeCls('low')}" onclick="setStatusFilter('low')"><div class="stat-num">${lowCount}</div><div class="stat-label">🔴 Buy soon</div></div>
    <div class="stat-chip cart" onclick="switchTab('shop')"><div class="stat-num">${cartCount}</div><div class="stat-label">🛒 Shopping list</div></div>
  `;
}

function setStatusFilter(cls){
  const next = (statusFilter === cls) ? null : cls;
  clearSearch(); // clears search text and resets statusFilter as a side effect
  statusFilter = next;
  activeCategory = 'all';
  renderCategoryChips();
  renderDashboard();
  renderGrid();
  document.getElementById('item-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------------- NEEDS YOUR ATTENTION ---------------- */

function renderAttentionList(){
  const wrap = document.getElementById('attention-section');
  const scoped = (activeCategory !== 'all' && activeCategory !== 'favorites')
    ? items.filter(i => i.category_id === activeCategory)
    : items;
  const low = scoped.filter(i => statusFor(i).cls === 'low');
  const mid = scoped.filter(i => statusFor(i).cls === 'mid');
  const scopedCat = categories.find(c => c.id === activeCategory);
  const title = scopedCat ? `🔔 Needs Attention — ${scopedCat.name}` : '🔔 Needs Your Attention';

  if (!low.length && !mid.length){
    wrap.innerHTML = `
      <div class="attention-title">${title}</div>
      <div class="attention-empty">✅ Nothing needs attention right now</div>
    `;
    return;
  }

  function groupHtml(list, label, cls){
    if (!list.length) return '';
    const rows = list.map(item => {
      const cat = categories.find(c => c.id === item.category_id);
      return `
      <div class="attention-row" data-id="${item.id}">
        <div class="emoji">${item.emoji}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="meta">${cat ? cat.emoji + ' ' + cat.name : ''}</div>
        </div>
      </div>
    `;
    }).join('');
    return `<div class="attention-group">
      <div class="attention-group-label ${cls}">${label}</div>
      ${rows}
    </div>`;
  }

  wrap.innerHTML = `
    <div class="attention-title">${title}</div>
    ${groupHtml(low, '🔴 Buy Now', 'low')}
    ${groupHtml(mid, '🟠 Running Low', 'mid')}
  `;

  wrap.querySelectorAll('.attention-row').forEach(row => {
    row.onclick = () => {
      const item = items.find(i => i.id === row.dataset.id);
      if (item) openEditModal(item);
    };
  });
}

function subscribeRealtime(){
  supabaseClient.channel('items-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => {
      refreshItems();
    })
    .subscribe();

  supabaseClient.channel('activity-changes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'activity_log' }, () => {
      renderRecentActivity();
    })
    .subscribe();
}

/* ---------------- RECENTLY UPDATED FEED ---------------- */

async function renderRecentActivity(){
  const wrap = document.getElementById('recent-activity-section');
  const { data, error } = await supabaseClient.from('activity_log')
    .select('*').order('created_at', { ascending: false }).limit(8);
  if (error || !data || !data.length){
    wrap.innerHTML = '';
    return;
  }
  const rows = data.map(a => `
    <div class="activity-row">
      <span class="emoji">${a.item_emoji || '📦'}</span>
      <span><b>${a.performed_by}</b> ${a.action} — <b>${a.item_name}</b></span>
      <span class="time">${formatUpdatedTime(a.created_at)}</span>
    </div>
  `).join('');
  wrap.innerHTML = `<div class="recent-activity-title">🕐 Recently Updated</div>${rows}`;
}

function clearSearch(){
  searchQuery = '';
  statusFilter = null;
  const input = document.getElementById('search-input');
  if (input) input.value = '';
  renderDashboard();
}

function renderCategoryChips(){
  const row = document.getElementById('category-chips');
  row.innerHTML = '';
  const allChip = document.createElement('div');
  allChip.className = 'chip' + (activeCategory === 'all' ? ' active' : '');
  allChip.textContent = 'All';
  allChip.onclick = () => { activeCategory = 'all'; clearSearch(); renderCategoryChips(); renderGrid(); renderAttentionList(); };
  row.appendChild(allChip);

  const favChip = document.createElement('div');
  favChip.className = 'chip' + (activeCategory === 'favorites' ? ' active' : '');
  favChip.textContent = '⭐ Favorites';
  favChip.onclick = () => { activeCategory = 'favorites'; clearSearch(); renderCategoryChips(); renderGrid(); renderAttentionList(); };
  row.appendChild(favChip);

  categories.forEach(c => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCategory === c.id ? ' active' : '');
    chip.textContent = `${c.emoji} ${c.name}`;
    chip.onclick = () => { activeCategory = c.id; clearSearch(); renderCategoryChips(); renderGrid(); renderAttentionList(); };
    row.appendChild(chip);
  });
}

function statusFor(item){
  if (item.quantity_type === 'level'){
    if (item.quantity_level === 'low') return { cls:'low', label:'🔴 Buy soon' };
    if (item.quantity_level === 'medium') return { cls:'mid', label:'🟠 Getting low' };
    return { cls:'ok', label:'🟢 Stocked' };
  } else {
    const qty = Number(item.quantity_value);
    const th = Number(item.low_threshold);
    if (qty <= th) return { cls:'low', label:'🔴 Buy soon' };
    if (qty <= th * 2) return { cls:'mid', label:'🟠 Getting low' };
    return { cls:'ok', label:'🟢 Stocked' };
  }
}

function renderGrid(){
  const grid = document.getElementById('item-grid');
  grid.innerHTML = '';
  const q = searchQuery.trim().toLowerCase();
  const list = items.filter(i => {
    if (q) return i.name.toLowerCase().includes(q);
    if (statusFilter) return statusFor(i).cls === statusFilter;
    if (activeCategory === 'favorites') return !!i.is_favorite;
    return activeCategory === 'all' || i.category_id === activeCategory;
  });
  if (!list.length){
    let msg = 'No items here yet.';
    if (q) msg = `No items match "${searchQuery}"`;
    else if (statusFilter) msg = 'No items in this group right now.';
    else if (activeCategory === 'favorites') msg = 'No favorites yet — tap the ☆ on any item to add one.';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span class="big">📭</span>${msg}</div>`;
    return;
  }
  list.forEach(item => grid.appendChild(renderCard(item)));
}

async function toggleFavorite(item){
  const next = !item.is_favorite;
  await supabaseClient.from('items').update({ is_favorite: next }).eq('id', item.id);
}

function onSearchInput(){
  searchQuery = document.getElementById('search-input').value;
  if (searchQuery && statusFilter){ statusFilter = null; renderDashboard(); }
  renderGrid();
}

function renderCard(item){
  const card = document.createElement('div');
  const status = statusFor(item);
  card.className = 'card status-' + status.cls;

  const photo = document.createElement('div');
  photo.className = 'emoji-photo status-' + status.cls;
  photo.innerHTML = item.image_url ? `<img src="${item.image_url}" alt="${item.name}">` : item.emoji;
  card.appendChild(photo);

  const fav = document.createElement('button');
  fav.className = 'fav-star' + (item.is_favorite ? ' active' : '');
  fav.textContent = item.is_favorite ? '★' : '☆';
  fav.title = item.is_favorite ? 'Remove from favorites' : 'Add to favorites';
  fav.onclick = (e) => { e.stopPropagation(); toggleFavorite(item); };
  card.appendChild(fav);

  const del = document.createElement('button');
  del.className = 'delete-x';
  del.textContent = '✕';
  del.onclick = () => deleteItem(item.id);
  card.appendChild(del);

  const name = document.createElement('div');
  name.className = 'item-name';
  name.textContent = item.name;
  name.style.cursor = 'pointer';
  name.title = 'Tap to edit';
  name.onclick = () => openEditModal(item);
  card.appendChild(name);

  const cat = categories.find(c => c.id === item.category_id);
  if (cat){
    const catLabel = document.createElement('div');
    catLabel.className = 'card-category';
    catLabel.textContent = `${cat.emoji} ${cat.name}`;
    card.appendChild(catLabel);
  }

  const pill = document.createElement('div');
  pill.className = 'status-pill ' + status.cls;
  pill.textContent = (item.quantity_type === 'numeric')
    ? `${trimNum(item.quantity_value)} ${item.unit} · ${status.label}`
    : status.label;
  card.appendChild(pill);

  if (item.updated_by){
    const meta = document.createElement('div');
    meta.className = 'updated-by';
    meta.textContent = `Updated by ${item.updated_by} • ${formatUpdatedTime(item.updated_at)}`;
    card.appendChild(meta);
  }

  if (item.quantity_type === 'level'){
    const ctrl = document.createElement('div');
    ctrl.className = 'level-control';
    ['low','medium','high'].forEach(lvl => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (item.quantity_level === lvl ? ` selected ${lvl}` : '');
      btn.textContent = lvl[0].toUpperCase() + lvl.slice(1);
      btn.onclick = () => updateLevel(item, lvl);
      ctrl.appendChild(btn);
    });
    card.appendChild(ctrl);
  } else {
    const ctrl = document.createElement('div');
    ctrl.className = 'numeric-control';
    const minus = document.createElement('button');
    minus.textContent = '−';
    minus.onclick = () => updateNumeric(item, -stepFor(item));
    const qty = document.createElement('div');
    qty.className = 'qty';
    qty.textContent = `${trimNum(item.quantity_value)} ${item.unit}`;
    const plus = document.createElement('button');
    plus.textContent = '+';
    plus.onclick = () => updateNumeric(item, stepFor(item));
    ctrl.appendChild(minus); ctrl.appendChild(qty); ctrl.appendChild(plus);
    card.appendChild(ctrl);
  }

  return card;
}

function formatUpdatedTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const yest = new Date(now); yest.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yest.toDateString();
  const timeStr = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (sameDay) return timeStr;
  if (isYesterday) return `Yesterday, ${timeStr}`;
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + `, ${timeStr}`;
}

function stepFor(item){
  return item.unit === 'pcs' ? 1 : 0.5;
}
function trimNum(n){
  n = Number(n);
  return Number.isInteger(n) ? n : n.toFixed(1);
}

async function logActivity(item, action){
  try {
    await supabaseClient.from('activity_log').insert({
      item_name: item.name, item_emoji: item.emoji, action, performed_by: currentUser.name
    });
  } catch (e) { console.error('activity log failed', e); }
}

async function updateLevel(item, level){
  const wasLow = item.quantity_level === 'low';
  await supabaseClient.from('items').update({
    quantity_level: level, updated_by: currentUser.name, updated_at: new Date().toISOString()
  }).eq('id', item.id);
  logActivity(item, `marked ${level[0].toUpperCase()+level.slice(1)}`);
  if (level === 'low' && !wasLow) notifyLowStock(item);
}

async function updateNumeric(item, delta){
  const newQty = Math.max(0, Number(item.quantity_value) + delta);
  const wasLow = Number(item.quantity_value) <= Number(item.low_threshold);
  const nowLow = newQty <= Number(item.low_threshold);
  await supabaseClient.from('items').update({
    quantity_value: newQty, updated_by: currentUser.name, updated_at: new Date().toISOString()
  }).eq('id', item.id);
  logActivity(item, `set to ${trimNum(newQty)} ${item.unit}`);
  if (nowLow && !wasLow) notifyLowStock(item);
}

async function deleteItemSecurely(id, item){
  const adminPin = prompt('Enter your admin PIN to confirm deletion:');
  if (adminPin === null) return false; // cancelled
  const { error } = await supabaseClient.rpc('delete_item_secure', {
    p_item_id: id, p_admin_pin: adminPin
  });
  if (error){
    alert('Incorrect PIN — item was not deleted.');
    return false;
  }
  if (item) logActivity(item, 'removed');
  return true;
}

async function deleteItem(id){
  if (!confirm('Remove this item?')) return;
  const item = items.find(i => i.id === id);
  await deleteItemSecurely(id, item);
}

/* ---------------- SHOPPING LIST ---------------- */

function renderShopList(){
  const wrap = document.getElementById('shop-list');
  wrap.innerHTML = '';
  const low = items.filter(i => statusFor(i).cls === 'low');
  const mid = items.filter(i => statusFor(i).cls === 'mid');

  if (!low.length && !mid.length){
    wrap.innerHTML = `<div class="empty-state"><span class="big">✅</span>Everything's stocked up!</div>`;
    return;
  }

  function rowHtml(item){
    const cat = categories.find(c => c.id === item.category_id);
    const status = statusFor(item);
    return `
      <div class="shop-row">
        <div class="emoji">${item.emoji}</div>
        <div class="info">
          <div class="name">${item.name}</div>
          <div class="cat">${cat ? cat.name : ''}</div>
        </div>
        <div class="status-pill ${status.cls}">${status.label}</div>
        <button class="mark-bought-btn" onclick="markAsBought('${item.id}')">✅ Bought</button>
      </div>
    `;
  }

  function groupHtml(list, label, cls){
    if (!list.length) return '';
    return `<div class="shop-group">
      <div class="attention-group-label ${cls}">${label}</div>
      ${list.map(rowHtml).join('')}
    </div>`;
  }

  wrap.innerHTML = `
    ${groupHtml(low, '🔴 BUY NOW', 'low')}
    ${groupHtml(mid, '🟠 BUY SOON', 'mid')}
  `;
}

/* ---------------- MARK AS BOUGHT (restock) ---------------- */

let buyingItemId = null;

async function markAsBought(itemId){
  const item = items.find(i => i.id === itemId);
  if (!item) return;

  if (item.quantity_type === 'level'){
    if (!confirm(`Mark ${item.name} as bought and fully restocked?`)) return;
    await supabaseClient.from('items').update({
      quantity_level: 'high', updated_by: currentUser.name, updated_at: new Date().toISOString()
    }).eq('id', itemId);
    logActivity(item, 'bought — fully restocked');
    return;
  }

  buyingItemId = itemId;
  document.getElementById('buy-modal-item-name').textContent =
    `${item.emoji} ${item.name} — currently ${trimNum(item.quantity_value)} ${item.unit}`;
  document.getElementById('buy-unit-label').textContent = item.unit;
  document.getElementById('buy-quantity').value = '';
  document.getElementById('buy-modal-backdrop').classList.add('open');
}

function closeBuyModal(){
  document.getElementById('buy-modal-backdrop').classList.remove('open');
  buyingItemId = null;
}

async function confirmBuy(){
  if (!buyingItemId) return;
  const item = items.find(i => i.id === buyingItemId);
  const qty = Number(document.getElementById('buy-quantity').value);
  if (!qty || qty <= 0) return alert('Enter how much you bought');
  const newQty = Number(item.quantity_value) + qty;
  await supabaseClient.from('items').update({
    quantity_value: newQty, updated_by: currentUser.name, updated_at: new Date().toISOString()
  }).eq('id', buyingItemId);
  logActivity(item, `bought +${trimNum(qty)} ${item.unit}`);
  closeBuyModal();
}

/* ---------------- TABS ---------------- */

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tab-home').style.display = tab === 'home' ? 'block' : 'none';
  document.getElementById('tab-shop').style.display = tab === 'shop' ? 'block' : 'none';
  document.getElementById('nav-home').classList.toggle('active', tab === 'home');
  document.getElementById('nav-shop').classList.toggle('active', tab === 'shop');
}

/* ---------------- ADD ITEM ---------------- */

let editingItemId = null;

function populateNewItemCategorySelect(){
  const sel = document.getElementById('new-category');
  sel.innerHTML = categories.map(c => `<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('');
}

function openAddModal(){
  editingItemId = null;
  document.getElementById('modal-title').textContent = 'Add an item';
  document.getElementById('modal-submit-btn').textContent = 'Add item';
  document.getElementById('modal-delete-btn').style.display = 'none';
  document.getElementById('new-name').value = '';
  document.getElementById('new-emoji').value = '';
  document.getElementById('new-type').value = 'level';
  document.getElementById('new-unit').value = 'kg';
  document.getElementById('new-threshold').value = '';
  toggleNewTypeFields();
  document.getElementById('add-modal-backdrop').classList.add('open');
}

function openEditModal(item){
  editingItemId = item.id;
  document.getElementById('modal-title').textContent = 'Edit item';
  document.getElementById('modal-submit-btn').textContent = 'Save changes';
  document.getElementById('modal-delete-btn').style.display = 'block';
  document.getElementById('new-name').value = item.name;
  document.getElementById('new-emoji').value = item.emoji;
  document.getElementById('new-category').value = item.category_id;
  document.getElementById('new-type').value = item.quantity_type;
  document.getElementById('new-unit').value = item.unit || '';
  document.getElementById('new-threshold').value = item.low_threshold ?? '';
  toggleNewTypeFields();
  document.getElementById('add-modal-backdrop').classList.add('open');
}

function closeAddModal(){
  document.getElementById('add-modal-backdrop').classList.remove('open');
  editingItemId = null;
}
function toggleNewTypeFields(){
  const isNumeric = document.getElementById('new-type').value === 'numeric';
  document.getElementById('new-numeric-fields').style.display = isNumeric ? 'flex' : 'none';
}

async function submitNewItem(){
  const name = document.getElementById('new-name').value.trim();
  const emoji = document.getElementById('new-emoji').value.trim() || '📦';
  const categoryId = document.getElementById('new-category').value;
  const type = document.getElementById('new-type').value;
  if (!name) return alert('Give the item a name');

  const payload = {
    name, emoji, category_id: categoryId, quantity_type: type,
    updated_by: currentUser.name, updated_at: new Date().toISOString()
  };
  if (type === 'numeric'){
    payload.unit = document.getElementById('new-unit').value.trim() || 'kg';
    payload.low_threshold = Number(document.getElementById('new-threshold').value) || 0;
    if (!editingItemId) payload.quantity_value = 0;
  } else {
    if (!editingItemId) payload.quantity_level = 'medium';
  }

  if (editingItemId){
    await supabaseClient.from('items').update(payload).eq('id', editingItemId);
    logActivity({ name, emoji }, 'edited');
  } else {
    await supabaseClient.from('items').insert(payload);
    logActivity({ name, emoji }, 'added');
  }
  closeAddModal();
}

async function deleteFromModal(){
  if (!editingItemId) return;
  if (!confirm('Remove this item?')) return;
  const item = items.find(i => i.id === editingItemId);
  const ok = await deleteItemSecurely(editingItemId, item);
  if (ok) closeAddModal();
}

/* ---------------- TELEGRAM NOTIFICATION (optional) ---------------- */

async function notifyLowStock(item){
  if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
  const text = `🔴 ${item.emoji} ${item.name} is running low — updated by ${currentUser.name}. Add it to the shopping list!`;
  try {
    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text })
    });
  } catch (e) { console.error('Telegram notify failed', e); }
}

/* ---------------- ROTATING VERSES (every 2 hours) ---------------- */

const VERSES = [
  { text: '"Man shall not live by bread alone, but by every word that proceedeth out of the mouth of God."', ref: 'Matthew 4:4' },
  { text: '"Trust in the LORD with all thine heart; and lean not unto thine own understanding."', ref: 'Proverbs 3:5' },
  { text: '"The LORD is my shepherd; I shall not want."', ref: 'Psalm 23:1' },
  { text: '"Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee."', ref: 'Joshua 1:9' },
  { text: '"Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God."', ref: 'Philippians 4:6' },
  { text: '"O taste and see that the LORD is good: blessed is the man that trusteth in him."', ref: 'Psalm 34:8' },
];

function currentVerseIndex(){
  const twoHourBlock = Math.floor(Date.now() / (2 * 60 * 60 * 1000));
  return twoHourBlock % VERSES.length;
}

let lastVerseIndex = null;

function updateVerseStrip(){
  const idx = currentVerseIndex();
  const el = document.getElementById('verse-strip');
  if (!el) return;
  if (lastVerseIndex === idx) return; // no change yet, skip re-render
  const isFirstLoad = lastVerseIndex === null;
  lastVerseIndex = idx;
  const v = VERSES[idx];
  if (isFirstLoad){
    el.textContent = `${v.text} — ${v.ref}`;
    return;
  }
  el.classList.add('fading');
  setTimeout(() => {
    el.textContent = `${v.text} — ${v.ref}`;
    el.classList.remove('fading');
  }, 400);
}

/* ---------------- INIT ---------------- */
updateVerseStrip();
setInterval(updateVerseStrip, 60 * 1000); // check every minute for the 2-hour boundary
initPinScreen();
